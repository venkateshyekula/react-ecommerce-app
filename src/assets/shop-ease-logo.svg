<svg
  width="900"
  height="300"
  viewBox="0 0 900 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="shopEaseLogoTitle shopEaseLogoDesc"
>
  <title id="shopEaseLogoTitle">ShopEase Logo</title>
  <desc id="shopEaseLogoDesc">
    ShopEase vector logo with pink shopping bag icon, bold ShopEase wordmark, animated background blur, and SMART SHOPPING MADE EASY tagline.
  </desc>

  <defs>
    <!-- Brand colors used:
      #ff3f6c
      #ee5f73
      #fb56c1
      #f26a10
      #f2c210
      #0db7af
    -->

    <radialGradient
      id="pinkBackgroundGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(190 145) rotate(30) scale(300 170)"
    >
      <animate
        attributeName="gradientTransform"
        dur="9s"
        repeatCount="indefinite"
        values="
          translate(190 145) rotate(30) scale(300 170);
          translate(215 128) rotate(42) scale(330 185);
          translate(170 158) rotate(24) scale(285 165);
          translate(190 145) rotate(30) scale(300 170)
        "
      />
      <stop offset="0%" stop-color="#ff3f6c" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#fb56c1" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <radialGradient
      id="warmBackgroundGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(650 120) rotate(26) scale(260 150)"
    >
      <animate
        attributeName="gradientTransform"
        dur="11s"
        repeatCount="indefinite"
        values="
          translate(650 120) rotate(26) scale(260 150);
          translate(620 145) rotate(18) scale(285 160);
          translate(675 105) rotate(34) scale(245 145);
          translate(650 120) rotate(26) scale(260 150)
        "
      />
      <stop offset="0%" stop-color="#f2c210" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#f26a10" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <radialGradient
      id="tealBackgroundGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(725 215) rotate(20) scale(190 110)"
    >
      <animate
        attributeName="gradientTransform"
        dur="10s"
        repeatCount="indefinite"
        values="
          translate(725 215) rotate(20) scale(190 110);
          translate(700 198) rotate(34) scale(215 120);
          translate(748 225) rotate(14) scale(175 105);
          translate(725 215) rotate(20) scale(190 110)
        "
      />
      <stop offset="0%" stop-color="#0db7af" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient
      id="bagGradient"
      x1="85"
      y1="40"
      x2="235"
      y2="250"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#fb56c1" />
      <stop offset="26%" stop-color="#ff3f6c" />
      <stop offset="62%" stop-color="#ee5f73" />
      <stop offset="100%" stop-color="#d91d59" />
    </linearGradient>

    <linearGradient
      id="bagDepthGradient"
      x1="205"
      y1="82"
      x2="250"
      y2="240"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Custom non-black gradient for "Shop" -->
    <linearGradient
      id="shopTextGradient"
      x1="310"
      y1="89"
      x2="500"
      y2="165"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#2d1b2f" />
    </linearGradient>

    <linearGradient
      id="easeTextGradient"
      x1="570"
      y1="89"
      x2="820"
      y2="165"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#ff3f6c" />
      <stop offset="52%" stop-color="#fb56c1" />
      <stop offset="100%" stop-color="#ee5f73" />
    </linearGradient>

    <linearGradient
      id="taglineGradient"
      x1="318"
      y1="205"
      x2="702"
      y2="205"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#0db7af" />
      <stop offset="23%" stop-color="#f2c210" />
      <stop offset="47%" stop-color="#f26a10" />
      <stop offset="72%" stop-color="#fb56c1" />
      <stop offset="100%" stop-color="#ff3f6c" />
    </linearGradient>

    <filter
      id="backgroundBlur"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur stdDeviation="22" />
    </filter>

    <filter
      id="bagShadow"
      x="-30%"
      y="-30%"
      width="170%"
      height="180%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="14"
        stdDeviation="11"
        flood-color="#ff3f6c"
        flood-opacity="0.25"
      />
    </filter>

    <filter
      id="wordmarkShadow"
      x="-8%"
      y="-18%"
      width="116%"
      height="142%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="4"
        flood-color="#111827"
        flood-opacity="0.13"
      />
    </filter>

    <linearGradient
      id="whiteSGradient"
      x1="105"
      y1="112"
      x2="185"
      y2="220"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Transparent base -->
  <rect width="900" height="300" rx="38" fill="transparent" />

  <!-- Soft animated background blur on transparent canvas -->
  <g filter="url(#backgroundBlur)" opacity="0.9">
    <animate
      attributeName="opacity"
      dur="7s"
      repeatCount="indefinite"
      values="0.76;0.95;0.82;0.92;0.76"
    />
    <rect width="900" height="300" rx="38" fill="url(#pinkBackgroundGlow)" />
    <rect width="900" height="300" rx="38" fill="url(#warmBackgroundGlow)" />
    <rect width="900" height="300" rx="38" fill="url(#tealBackgroundGlow)" />
  </g>

  <!-- Shopping bag icon -->
  <g filter="url(#bagShadow)">
    <!-- Bag handle -->
    <path
      d="M96 101V83C96 53.728 119.728 30 149 30C178.272 30 202 53.728 202 83V101"
      stroke="#ff3f6c"
      stroke-width="14"
      stroke-linecap="round"
    />

    <!-- Bag body -->
    <path
      d="M64.8 96.4C65.96 82.64 77.48 72.1 91.28 72.1H206.72C220.52 72.1 232.04 82.64 233.2 96.4L246 222.5C247.46 236.92 236.12 249.5 221.62 249.5H76.38C61.88 249.5 50.54 236.92 52 222.5L64.8 96.4Z"
      fill="url(#bagGradient)"
    />

    <!-- Bag right depth -->
    <path
      d="M207.5 82.5C215.8 82.5 222.74 88.86 223.52 97.1L234.55 212.95C235.65 224.48 226.58 234.45 214.99 234.45H194.8C204.88 220.35 210.85 194.95 210.85 160.02C210.85 124.45 205.95 100.48 195.2 82.5H207.5Z"
      fill="url(#bagDepthGradient)"
    />

    <!-- White S shape -->
    <path
      d="M171.1 115.2C161.45 111.5 151.35 109.86 141.02 110.1C119.7 110.6 100.86 121.65 96.36 139.72C92.4 155.6 101.92 166.5 121.7 173.74L144.46 182.05C154.28 185.64 157.52 188.92 156.7 194.01C155.68 200.86 147.36 205.27 135 205.04C122.1 204.8 108.88 200.92 97.96 194.95C93.92 192.74 89.1 195.63 89.1 200.2V216.42C89.1 219.66 90.96 222.64 93.9 224.06C105.16 229.5 120.04 232.75 135.78 232.75C162 232.75 182.8 220.43 187.23 201.13C191.06 184.53 182.18 173.02 162.34 165.68L138.42 156.8C129.28 153.44 126.2 150.52 127.08 145.68C128.06 139.62 135.6 135.9 146.48 136.1C157.24 136.28 167.62 139 176.78 143.12C180.96 145 185.62 142 185.62 137.42V123.05C185.62 119.4 183.66 116.18 180.4 114.78C177.68 113.6 174.38 114.4 171.1 115.2Z"
      fill="url(#whiteSGradient)"
    />
  </g>

  <!-- Wordmark using tspan for automatic spacing -->
  <g filter="url(#wordmarkShadow)">
    <text
      x="310"
      y="162"
      font-family="Inter, Poppins, Arial, Helvetica, sans-serif"
      font-size="84"
      font-weight="600"
      letter-spacing="-3.2"
    >
      <tspan fill="url(#shopTextGradient)">Shop</tspan>
      <tspan fill="url(#easeTextGradient)">Ease</tspan>
    </text>
  </g>

  <!-- Responsive tagline -->
  <text
    x="318"
    y="205"
    font-family="Inter, Poppins, Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="2.4"
    textLength="380"
    lengthAdjust="spacingAndGlyphs"
    fill="url(#taglineGradient)"
  >
    SMART SHOPPING MADE EASY
  </text>

  <!-- Small palette underline -->
  <rect x="318" y="219" width="76" height="5" rx="2.5" fill="#ff3f6c" />
  <rect x="403" y="219" width="46" height="5" rx="2.5" fill="#ee5f73" />
  <rect x="458" y="219" width="46" height="5" rx="2.5" fill="#fb56c1" />
  <rect x="513" y="219" width="46" height="5" rx="2.5" fill="#f26a10" />
  <rect x="568" y="219" width="46" height="5" rx="2.5" fill="#f2c210" />
  <rect x="623" y="219" width="46" height="5" rx="2.5" fill="#0db7af" />
</svg>