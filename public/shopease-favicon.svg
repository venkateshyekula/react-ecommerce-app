<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Shopping Bag Gradient -->
    <linearGradient id="favBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A6D" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>

    <!-- Side Fold Shadows -->
    <linearGradient id="favFoldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D60045" />
      <stop offset="100%" stop-color="#A80036" />
    </linearGradient>

    <linearGradient id="favFoldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A60" />
      <stop offset="100%" stop-color="#D60045" />
    </linearGradient>
  </defs>

  <g id="faviconGroup">
    <!-- Bag Handle -->
    <path d="M 25 18 C 25 9, 39 9, 39 18" 
          fill="none" 
          stroke="#FF2A6D" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Main Shopping Bag Base -->
    <path d="M 18 20 
             L 46 20 
             A 4 4 0 0 1 50 24 
             L 54 50 
             A 6 6 0 0 1 48 56 
             L 16 56 
             A 6 6 0 0 1 10 50 
             L 14 24 
             A 4 4 0 0 1 18 20 Z" 
          fill="url(#favBagGrad)" />

    <!-- Left Fold Accent -->
    <path d="M 10 50 L 14 24 C 14 24 17 38 24 43 C 16 47 11 52 11 52 A 6 6 0 0 1 10 50 Z" 
          fill="url(#favFoldLeft)" 
          opacity="0.5" />

    <!-- Right Fold Accent -->
    <path d="M 54 50 A 6 6 0 0 1 48 56 L 39 56 C 46 51 49 44 49 44 L 54 50 Z" 
          fill="url(#favFoldRight)" />

    <!-- Integrated "S" Curve -->
    <path d="M 40 26 
             C 30 26, 23 29, 23 35 
             C 23 42, 38 40, 34 49 
             C 31 54, 23 55, 16 56 
             L 37 56 
             C 45 56, 48 49, 46 43 
             C 43 35, 30 36, 33 31 
             C 35 28, 41 28, 45 30 
             Z" 
          fill="#FFFFFF" />

    <!-- Integrated "E" Extension Accent -->
    <path d="M 32 38 L 42 38 C 43.5 38, 43.5 40.5, 42 40.5 L 34 40.5 Z" 
          fill="#FFFFFF" />
  </g>
</svg>
